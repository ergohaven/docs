zmk_split:
  ru:
    title: Как обновить прошивку
    steps:
      - "Скачайте файлы прошивки для левой и правой половинок"
      - "Подключите левую половинку по USB-C, дважды быстро нажмите <code>Reset</code> на нижней стороне корпуса и скопируйте на появившийся диск файл <code>left</code>"
      - "Повторите действия для правой половинки, используя файл <code>right</code>"
      - "После обновления одновременно нажмите <code>Reset</code> на обеих половинках, чтобы восстановить их соединение"
    step_notes:
      - after_step: 1
        text: 'Если вы хотите использовать <a href="https://docs.eh.works/software/zmk/zmk-ruen/">RuEn</a>, скачайте соответствующую RuEn-прошивку'
