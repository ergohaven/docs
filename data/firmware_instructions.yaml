rmk_split:
  ru:
    title: Как обновить прошивку
    steps:
      - 'При необходимости сохраните текущую раскладку в <a href="https://entropy.tools/ru/" target="_blank" rel="noopener">Entropy</a>'
      - "Скачайте файлы прошивки для левой и правой половинок"
      - "Подключите левую половинку по USB-C, дважды быстро нажмите <code>Reset</code> с обратной стороны корпуса и скопируйте на появившийся диск файл <code>left</code>"
      - "Повторите действия для правой половинки, используя файл <code>right</code>"
      - "После обновления импортируйте сохранённую раскладку"
    note: "Если при копировании прошивки появляется окно с ошибкой копирования/извлечения диска, просто игнорируйте это сообщение"
  en:
    title: How to update the firmware
    steps:
      - 'Save the current layout in <a href="https://entropy.tools" target="_blank" rel="noopener">Entropy</a> if needed'
      - "Download the firmware files for the left and right halves"
      - "Connect the left half via USB-C, quickly double-press <code>Reset</code> on the back of the case, and copy the <code>left</code> file to the drive that appears"
      - "Repeat these steps for the right half using the <code>right</code> file"
      - "Import the saved layout after the update"
    note: "If a copy or disk ejection error appears while copying the firmware, simply ignore the message"

rmk_archive_split:
  ru:
    title: Как обновить прошивку
    steps:
      - 'При необходимости сохраните текущую раскладку в <a href="https://entropy.tools/ru/" target="_blank" rel="noopener">Entropy</a>'
      - "Скачайте архив с прошивками и распакуйте его"
      - "Подключите левую половинку по USB-C, дважды быстро нажмите <code>Reset</code> с обратной стороны корпуса и скопируйте на появившийся диск файл <code>left</code>"
      - "Повторите действия для правой половинки, используя файл <code>right</code>"
      - "После обновления импортируйте сохранённую раскладку"
    step_notes:
      - after_step: 4
        text: "После прошивки обязательно сделайте сброс половинок - одновременно нажмите и отпустите кнопки Reset на нижней стороне корпуса половинок"
    note: "Если при копировании прошивки появляется окно с ошибкой копирования/извлечения диска, просто игнорируйте это сообщение"
  en:
    title: How to update the firmware
    steps:
      - 'Save the current layout in <a href="https://entropy.tools" target="_blank" rel="noopener">Entropy</a> if needed'
      - "Download and extract the firmware archive"
      - "Connect the left half via USB-C, quickly double-press <code>Reset</code> on the back of the case, and copy the <code>left</code> file to the drive that appears"
      - "Repeat these steps for the right half using the <code>right</code> file"
      - "Import the saved layout after the update"
    step_notes:
      - after_step: 4
        text: "After flashing, be sure to reset both halves: simultaneously press and release the Reset buttons on the bottom of both halves"
    note: "If a copy or disk ejection error appears while copying the firmware, simply ignore the message"

rmk_qube:
  ru:
    title: Как обновить прошивку
    steps:
      - 'При необходимости сохраните текущую раскладку в <a href="https://entropy.tools/ru/" target="_blank" rel="noopener">Entropy</a>'
      - "Скачайте архив с прошивками и распакуйте его"
      - "Подключите Qube по USB-C, дважды быстро нажмите <code>Reset</code> на нижней стороне корпуса и скопируйте на появившийся диск файл <code>dongle</code>"
      - "Подключите левую половинку по USB-C, дважды быстро нажмите <code>Reset</code> с обратной стороны корпуса и скопируйте на появившийся диск файл <code>left</code>"
      - "Повторите действия для правой половинки, используя файл <code>right</code>"
      - "После обновления подключите Qube по USB-C. Затем включите левую половинку и после её подключения — правую"
      - "Импортируйте сохранённую раскладку"
    step_notes:
      - after_step: 5
        text: "После прошивки обязательно сделайте сброс половинок - одновременно нажмите и отпустите кнопки Reset на нижней стороне корпуса половинок"
    note: "Если при копировании прошивки появляется окно с ошибкой копирования/извлечения диска, просто игнорируйте это сообщение"
  en:
    title: How to update the firmware
    steps:
      - 'Save the current layout in <a href="https://entropy.tools" target="_blank" rel="noopener">Entropy</a> if needed'
      - "Download and extract the firmware archive"
      - "Connect Qube via USB-C, quickly double-press <code>Reset</code> on the bottom of the case, and copy the <code>dongle</code> file to the drive that appears"
      - "Connect the left half via USB-C, quickly double-press <code>Reset</code> on the back of the case, and copy the <code>left</code> file to the drive that appears"
      - "Repeat these steps for the right half using the <code>right</code> file"
      - "After the update, connect Qube via USB-C. Then turn on the left half and, once it connects, turn on the right half"
      - "Import the saved layout"
    step_notes:
      - after_step: 5
        text: "After flashing, be sure to reset both halves: simultaneously press and release the Reset buttons on the bottom of both halves"
    note: "If a copy or disk ejection error appears while copying the firmware, simply ignore the message"

rmk_single:
  ru:
    title: Как обновить прошивку
    steps:
