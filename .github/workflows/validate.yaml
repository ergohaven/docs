name: Validate documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Hugo build and firmware selector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.147.7'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build documentation
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --destination "$RUNNER_TEMP/docs-public" --cacheDir "$RUNNER_TEMP/hugo-cache"
      - name: Test rendered firmware selector
        run: node scripts/test-firmware-picker.cjs "$RUNNER_TEMP/docs-public"
      - name: Test firmware release resolver
        run: node scripts/test-firmware-release-links.cjs
      - name: Check whitespace
        run: git diff --check
